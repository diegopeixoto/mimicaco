<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mimicaço da Turma do Rawzinho · Tela principal</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  #stage { position: fixed; inset: 0; right: 400px; }
  @media (max-width: 900px) { #stage { right: 0; bottom: 45vh; } }
  header { position: fixed; top: 12px; left: 16px; right: 416px; display: flex; align-items: center; justify-content: space-between; pointer-events: none; z-index: 5; }
  @media (max-width: 900px) { header { right: 16px; } }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { height: 74px; filter: drop-shadow(0 4px 0 rgba(0,0,0,.2)); }
  .brand .logo { font-family: 'Lilita One', sans-serif; font-size: 2.2rem; color: #fff; -webkit-text-stroke: 2px #123a7a; paint-order: stroke fill; text-shadow: 0 4px 0 #123a7a; }
  .brand .logo span { color: var(--accent); }
  .roomcode { font-size: 1.1rem; background: var(--card); padding: .2em .9em; border-radius: 999px; border: 3px solid rgba(255,255,255,.4); }
  .roomcode b { font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 1.8rem; letter-spacing: .15em; color: var(--accent); }

  aside { position: fixed; top: 0; right: 0; bottom: 0; width: 400px; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; z-index: 6; }
  @media (max-width: 900px) { aside { top: auto; left: 0; width: auto; height: 45vh; } }
  .panel { background: var(--card); backdrop-filter: blur(6px); }
  .team { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; background: rgba(0,0,0,.15); }
  .team + .team { margin-top: 8px; }
  .team .dot { width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff 0 10%, var(--tc) 40%); flex: none; }
  .team .names { font-size: .9rem; color: var(--muted); line-height: 1.25; }
  .team .pos { margin-left: auto; font-family: 'Lilita One', sans-serif; font-size: 1.4rem; }
  .team.current { outline: 3px solid var(--tc); background: rgba(255,255,255,.1); }
  .team input { background: transparent; color: var(--ink); padding: 0; font-weight: 700; width: 100%; }
  .off { opacity: .45; }
  .center { text-align: center; }
  .catart { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; border: 5px solid #fff; box-shadow: 0 8px 0 rgba(10,30,70,.3); display: block; margin: 0 auto 10px; }
  .twist { display: inline-block; background: var(--bad); color: #fff; font-weight: 800; padding: .2em .8em; border-radius: 999px; margin-top: 6px; }
  .timer { font-family: 'Lilita One', sans-serif; font-size: 5rem; line-height: 1; }
  .timer.low { color: var(--bad); animation: pulse .5s infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .bar { height: 12px; background: rgba(0,0,0,.25); border-radius: 99px; overflow: hidden; margin: 10px 0; }
  .bar > div { height: 100%; background: var(--accent); transition: width .25s linear; }
  .btns { display: grid; gap: 8px; margin-top: 12px; }
  .btns.two { grid-template-columns: 1fr 1fr; }
  .qr { background: #fff; padding: 10px; border-radius: 16px; width: 180px; margin: 0 auto; display: block; }
  .settings label { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .settings select { width: auto; padding: .35em .8em; }
  .settings input[type=checkbox] { width: 22px; height: 22px; }
  .banner { background: var(--accent); color: #123a7a; font-family: 'Lilita One', sans-serif; padding: .3em .8em; border-radius: 12px; margin-bottom: 10px; }
  .word { font-family: 'Lilita One', sans-serif; font-size: 2rem; color: var(--accent); min-height: 1.2em; }
  .peek { user-select: none; -webkit-user-select: none; }

  .toast { position: fixed; left: calc((100vw - 400px) / 2); top: 50%; transform: translate(-50%, -50%) scale(.3); opacity: 0; z-index: 40; text-align: center; pointer-events: none;
    transition: transform .45s cubic-bezier(.3,1.7,.5,1), opacity .3s; }
  @media (max-width: 900px) { .toast { left: 50%; top: 25vh; } }
  .toast.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  .toast img { width: 200px; height: 200px; border-radius: 50%; object-fit: cover; border: 7px solid #fff; box-shadow: 0 10px 0 rgba(10,30,70,.35); }
  .toast h1 { font-size: 3.4rem; color: #fff; -webkit-text-stroke: 3px #123a7a; paint-order: stroke fill; text-shadow: 0 6px 0 #123a7a; margin: .2em 0 0; }
  .toast p { font-size: 1.3rem; font-weight: 800; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.6); margin: .2em 0; }

  .toast.sub { top: auto; bottom: 6vh; transform: translate(-50%, 0) scale(.6); z-index: 46; }
  .toast.sub.show { transform: translate(-50%, 0) scale(1); }
  .toast.sub p { font-size: 1.6rem; background: rgba(18,58,122,.85); padding: .3em 1em; border-radius: 999px; text-shadow: none; }
  /* Rawzinho/Toninho em Rive por cima do tabuleiro (fora do painel lateral) */
  @media (min-width: 901px) { #riveFx { right: 400px !important; } }
  #riveFx canvas { width: min(100%, 78vh) !important; height: 92vh !important; }
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(18,58,122,.55); z-index: 50; padding: 16px; }
  .overlay .panel { max-width: 520px; width: 100%; text-align: center; }
  .confetti { position: fixed; top: -20px; width: 12px; height: 18px; z-index: 60; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  .loading { position: fixed; left: calc((100vw - 400px) / 2); top: 50%; transform: translate(-50%, -50%); font-family: 'Lilita One', sans-serif; font-size: 1.6rem; color: #fff; text-shadow: 0 3px 0 #123a7a; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="loading" id="loading">Montando o tabuleiro…</div>
<header>
  <div class="brand"><img src="img/logo.png" alt="Turma do Rawzinho"><div class="logo">Mimic<span>aço</span></div></div>
  <div class="roomcode">Sala <b id="code">····</b></div>
</header>
<aside id="side"></aside>
<div class="toast" id="toast"></div>
<div id="overlay"></div>

<script src="net.js"></script>
<script src="rive-fx.js"></script>
<script type="module">
import { createBoard } from './board3d.js';

const params = new URLSearchParams(location.search);
const code = (params.get('sala') || '').toUpperCase();
const hostKey = store('mimica_host_' + code);
if (!hostKey) { alert('Esta tela não é a principal desta sala. Crie uma sala nova.'); location.href = '/'; }
document.getElementById('code').textContent = code;
const joinUrl = `${location.origin}/${code}`;
const img = (k) => `img/${k}.jpg`;

let S = null, lastPhase = null, lastResultId = null, lastMoveId = null, board = null;
const net = connect(() => ({ code, hostKey }), (st) => { S = st; render(); }, (err) => { alert(err); location.href = '/'; });
const send = (m) => net.send(m);
const now = () => Date.now() + net.offset;
const moving = () => S?.move && now() < S.move.at + S.move.dur;

createBoard(document.getElementById('stage'), {
  onDice: () => Som.play('dado'),
  onHop: () => Som.play('pulo', .45),
}).then((b) => { board = b; document.getElementById('loading').remove(); if (S) board.update(S, net.offset); });

// ---------- Painel ----------
function peopleHtml(t) {
  return t.people.map((p) => `<span class="${p.connected ? '' : 'off'}">${esc(p.name)}</span>`).join(', ') || '<i>ninguém ainda</i>';
}
function teamsHtml(editable) {
  return S.teams.map((t) => {
    const cur = S.turn && S.turn.actingId === t.id && S.phase !== 'lobby';
    const title = editable ? `<input value="${esc(t.name)}" data-team="${t.id}" maxlength="20">` : `<b>${esc(t.name)}</b>`;
    return `<div class="team ${cur ? 'current' : ''}" style="--tc:${t.color}"><div class="dot"></div>
      <div style="flex:1;min-width:0">${title}<div class="names">${peopleHtml(t)}</div></div>
      ${S.phase !== 'lobby' ? `<div class="pos">${t.pos}</div>` : ''}</div>`;
  }).join('') + (S.judges.length ? `<p class="muted" style="margin:.6em 0 0">⚖️ Juiz: ${S.judges.map((j) => esc(j.names.join(' e '))).join(', ')}</p>` : '');
}
function catBlock(cat, twist, big = 140) {
  const c = S.categories[cat];
  return `<img class="catart" src="${img(cat)}" alt="" style="width:${big}px;height:${big}px">
    <div class="pill" style="background:${c.color}">${c.emoji} ${esc(c.name)}</div>
    ${twist ? `<div><span class="twist">Regra extra: ${esc(twist)}</span></div>` : ''}`;
}
const teamById = (id) => S.teams.find((t) => t.id === id);
const pill = (t) => `<span class="pill" style="background:${t.color};color:#fff">${esc(t.name)}</span>`;

function renderSide() {
  const side = document.getElementById('side');
  if (S.phase === 'lobby') {
    const s = S.settings;
    const sel = (key, opts, val, fmt) => `<select data-set="${key}">${opts.map((o) => `<option value="${o}" ${o === val ? 'selected' : ''}>${fmt(o)}</option>`).join('')}</select>`;
    const chk = (key, label) => `<label>${label} <input type="checkbox" data-set="${key}" ${s[key] ? 'checked' : ''}></label>`;
    const ready = S.teams.every((t) => t.people.length);
    side.innerHTML = `<div class="panel center stack">
        <h2>Entrem pelo celular</h2>
        <img class="qr" src="/api/qr?u=${encodeURIComponent(joinUrl)}" alt="QR code">
        <div class="muted">ou acesse <b>${esc(location.host)}</b> e digite <b style="color:var(--accent)">${code}</b></div>
      </div>
      <div class="panel">${teamsHtml(true)}
        ${S.unassigned.length ? `<p class="muted">Escolhendo equipe: ${S.unassigned.map((p) => esc(p.names.join(' e '))).join(', ')}</p>` : ''}
        <div class="btns"><button class="big" data-act="start_game" ${ready ? '' : 'disabled'}>Começar jogo</button></div>
        ${ready ? '' : '<p class="muted center" style="margin:.5em 0 0">Cada equipe precisa de pelo menos 1 celular.</p>'}
      </div>
      <div class="panel settings stack">
        <label>Equipes ${sel('teamCount', [2, 3, 4, 5, 6], s.teamCount, (o) => o)}</label>
        <label>Tempo por mímica ${sel('seconds', [30, 45, 60, 90, 120], s.seconds, (o) => o + 's')}</label>
        <label>Tabuleiro ${sel('boardLength', [21, 31, 41], s.boardLength, (o) => ({ 21: 'Curto', 31: 'Médio', 41: 'Longo' })[o])}</label>
        ${chk('again', 'Acertou, joga de novo')}
        ${chk('steal', 'Repescagem (errou, a próxima tenta)')}
        ${chk('twists', 'Regras extras nas cartas')}
      </div>`;
  } else {
    const team = teamById(S.turn.teamId);
    const acting = teamById(S.turn.actingId);
    const mimer = S.turn.mimer ? esc(S.turn.mimer.name) : 'alguém da equipe';
    const anim = moving();
    let body = '';
    if (S.phase === 'turn') {
      body = `${S.message ? `<div class="banner">${esc(S.message)}</div>` : ''}
        <img class="catart" src="img/hero.jpg" alt="">
        <h2>Vez da ${pill(team)}</h2>
        <p>Joguem o dado no celular!</p>
        <div class="btns"><button class="big" data-act="roll" ${anim ? 'disabled' : ''}>🎲 Jogar o dado daqui</button></div>`;
    } else if (S.phase === 'draw') {
      const sq = S.board[team.pos];
      if (anim) body = `<h2>${pill(team)}</h2><p class="muted">Tirou <b style="font-size:1.6rem;color:var(--accent)">${S.move.value ?? ''}</b> no dado…</p>`;
      else {
        const where = sq.type === 'all' ? `<img class="catart" src="img/todos.jpg"><h2>⚡ Todos jogam!</h2><p class="muted">Qualquer equipe pode adivinhar. Quem acertar ganha +3 casas.</p>`
          : sq.type === 'finish' ? `${catBlock('dificil')}<h3>Última casa! Acertem para vencer!</h3>`
          : sq.cat ? catBlock(sq.cat) : '<p class="muted">Categoria surpresa!</p>';
        body = `${S.message ? `<div class="banner">${esc(S.message)}</div>` : ''}${where}
          <p><b>${mimer}</b>, puxe a carta no celular.</p>
          <div class="btns two"><button class="ghost" data-act="skip_mimer">Trocar mímico</button><button class="ghost" data-act="draw">Puxar daqui</button></div>`;
      }
    } else if (S.phase === 'card') {
      body = `${S.turn.steal ? `<div class="banner">🔁 Repescagem! ${esc(acting.name)} tenta a mesma carta</div>` : ''}
        <h2>${mimer} está lendo a carta…</h2>${catBlock(S.card.cat, S.card.twist)}
        <div class="word peek">${S.card.word ? esc(S.card.word) : ''}</div>
        <div class="btns two"><button class="ghost peek" id="peek">Segure p/ espiar</button><button data-act="go">Começar</button></div>`;
    } else if (S.phase === 'miming' || S.phase === 'timeup') {
      const results = S.turn.allPlay
        ? `<div class="btns">${S.teams.map((t) => `<button style="background:${t.color};color:#fff" data-result="${t.id}">${esc(t.name)} acertou</button>`).join('')}<button class="bad" data-result="">Ninguém acertou</button></div>`
        : `<div class="btns two"><button class="good" data-result="${acting.id}">Acertou!</button><button class="bad" data-result="">Não acertou</button></div>`;
      body = `${S.turn.steal ? '<div class="banner">🔁 Repescagem</div>' : ''}
        <h2>${S.turn.allPlay ? '⚡ Todos jogam' : pill(acting)}</h2>${catBlock(S.card.cat, S.card.twist, 110)}
        ${S.phase === 'timeup' ? '<img class="catart" src="img/tempo.jpg" alt="" style="width:100px;height:100px;margin-top:10px">' : ''}
        <div class="timer" id="timer">${S.phase === 'timeup' ? 'Tempo!' : ''}</div>
        <div class="bar"><div id="bar"></div></div>
        ${S.hasJudge ? '<p class="muted" style="margin:0">⚖️ O juiz decide no celular</p>' : ''}${results}`;
    } else if (S.phase === 'over') body = '<h2>Fim de jogo!</h2>';
    side.innerHTML = `<div class="panel center">${body}</div>
      <div class="panel">${teamsHtml(false)}</div>
      <div class="row" style="justify-content:space-between">
        <button class="ghost" data-act="skip_turn">Pular vez</button>
        <button class="ghost" data-act="back_to_lobby" data-confirm="Voltar ao início? O placar será zerado.">Encerrar partida</button>
      </div>`;
  }
  bindSide();
}

function bindSide() {
  document.querySelectorAll('[data-act]').forEach((b) => (b.onclick = () => {
    if (b.dataset.confirm && !confirm(b.dataset.confirm)) return;
    send({ t: b.dataset.act });
  }));
  document.querySelectorAll('[data-result]').forEach((b) => (b.onclick = () => send({ t: 'result', teamId: b.dataset.result || null })));
  document.querySelectorAll('[data-set]').forEach((el) => (el.onchange = () => {
    const v = el.type === 'checkbox' ? el.checked : Number(el.value);
    send({ t: 'settings', settings: { [el.dataset.set]: v } });
  }));
  document.querySelectorAll('[data-team]').forEach((el) => (el.onchange = () => send({ t: 'team_name', teamId: el.dataset.team, name: el.value })));
  const peek = document.getElementById('peek');
  if (peek) {
    peek.addEventListener('pointerdown', (e) => { e.preventDefault(); send({ t: 'peek', on: true }); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => peek.addEventListener(ev, () => send({ t: 'peek', on: false })));
  }
}

// ---------- Avisos grandes ----------
let toastTimer;
function toast(html, ms = 2200, sub = false) {
  const el = document.getElementById('toast');
  el.innerHTML = html;
  el.classList.toggle('sub', sub);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

// equipes alternam o mascote: 1ª Rawzinho, 2ª Toninho, 3ª Rawzinho...
const mascote = (t) => (t && S.teams.indexOf(t) % 2 === 1 ? 'toninho' : 'rawzinho');
let lastActingId = null;

function onEvents() {
  if (S.phase !== 'lobby') { window.RiveFx.preload('rawzinho').catch(() => {}); window.RiveFx.preload('toninho').catch(() => {}); }
  // na primeira atualização só anota o resultado que já existia (reconexão), sem mostrar aviso
  if (lastResultId === null) lastResultId = S.result ? S.result.id : 0;
  if (S.result && S.result.id !== lastResultId) {
    lastResultId = S.result.id;
    {
      const r = S.result, t = r.teamId && teamById(r.teamId);
      // personagem da equipe (Rawzinho ou Toninho) reage em Rive; se o Rive falhar, volta o aviso antigo
      const who = mascote(t || teamById(lastActingId));
      if (r.kind === 'miss') {
        Som.play('errou'); Som.voz('errou', 300);
        const sub = r.word ? `A palavra era “${esc(r.word)}”` : 'Repescagem! A próxima equipe tenta.';
        window.RiveFx.play('errou', who).then((ok) => ok ? toast(`<p>${sub}</p>`, 2000, true)
          : toast(`<img src="img/tempo.jpg"><h1>Não foi dessa vez!</h1><p>${sub}</p>`));
      } else {
        Som.play('acertou'); Som.voz('acertou', 300);
        const title = r.kind === 'steal_hit' ? 'Roubou a carta!' : 'Acertou!';
        window.RiveFx.play('acertou', who).then((ok) => ok ? toast(`<p>${r.kind === 'steal_hit' ? 'Roubou! ' : ''}${esc(t.name)} · “${esc(r.word)}”</p>`, 2000, true)
          : (toast(`<img src="img/acertou.jpg"><h1>${title}</h1><p>${esc(t.name)} · “${esc(r.word)}”</p>`), confetti(40)));
      }
    }
  }
  if (['card', 'miming', 'timeup'].includes(S.phase)) lastActingId = S.turn?.actingId;
  if (S.phase === lastPhase) return;
  if (S.phase === 'turn' && lastPhase && lastPhase !== 'lobby') Som.voz('suavez', 2600);
  if (S.phase === 'turn' && lastPhase === 'lobby') Som.voz('suavez', 300);
  if (S.phase === 'draw') {
    const t = teamById(S.turn.teamId);
    const sq = S.board[t.pos];
    const wait = S.move ? Math.max(0, S.move.at + S.move.dur - now()) : 0;
    setTimeout(() => { if (sq.type === 'all') Som.voz('todos'); }, wait + 50);
  }
  if (S.phase === 'card') Som.play('carta');
  if (S.phase === 'timeup' && lastPhase === 'miming') { Som.play('tempo'); Som.voz('tempo', 900); }
  if (S.phase === 'over') { Som.play('vitoria'); Som.voz('vitoria', 1800); }
  if (S.phase === 'lobby' && lastPhase && lastPhase !== 'lobby') Som.startMusic();
}

function renderOverlay() {
  const o = document.getElementById('overlay');
  if (S.phase === 'over') {
    const t = teamById(S.winner);
    o.innerHTML = `<div class="overlay"><div class="panel stack">
      <img class="catart" src="img/trofeu.jpg" style="width:200px;height:200px" alt="">
      <h1 style="color:${t.color}">${esc(t.name)} venceu!</h1>
      <p class="muted">${t.people.map((p) => esc(p.name)).join(', ')}</p>
      <button class="big" id="again">Jogar de novo</button></div></div>`;
    document.getElementById('again').onclick = () => send({ t: 'back_to_lobby' });
    if (lastPhase !== 'over') confetti(140);
  } else o.innerHTML = '';
}

function confetti(n) {
  const colors = ['#ffd23d', '#5cc93a', '#2f7bf5', '#e8453c', '#a26bff', '#ff6fb5'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = 2 + Math.random() * 3 + 's';
    c.style.animationDelay = Math.random() * 1.2 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 7000);
  }
}

let lastPlayers = null;
function render() {
  const players = S.teams.reduce((a, t) => a + t.people.length, 0) + S.unassigned.length + S.judges.length;
  if (lastPlayers !== null && players > lastPlayers) Som.play('pop');
  lastPlayers = players;
  board?.update(S, net.offset);
  const typing = document.activeElement?.dataset?.team;
  if (!typing) renderSide();
  renderOverlay();
  onEvents();
  // redesenha o painel quando a animação do peão termina
  if (S.move && S.move.id !== lastMoveId) {
    lastMoveId = S.move.id;
    setTimeout(() => S && renderSide(), Math.max(0, S.move.at + S.move.dur - now()) + 60);
  }
  lastPhase = S.phase;
}

// cronômetro local
let lastSec = null;
setInterval(() => {
  if (!S || S.phase !== 'miming') return;
  const left = Math.max(0, (S.timerEnd - now()) / 1000);
  const t = document.getElementById('timer'), bar = document.getElementById('bar');
  if (!t) return;
  const sec = Math.ceil(left);
  t.textContent = sec;
  t.classList.toggle('low', sec <= 10);
  const total = S.turn.steal ? Math.ceil(S.settings.seconds / 2) : S.settings.seconds;
  bar.style.width = (left / total) * 100 + '%';
  if (sec !== lastSec && sec <= 5 && sec > 0) Som.play('tique', .9);
  lastSec = sec;
}, 200);
Som.button(true);
Som.unlock(true, () => S && S.phase === 'lobby' && Som.voz('boasvindas', 400));
</script>
<footer id="rodape" data-mini></footer>
<script src="rodape.js"></script>
</body>
</html>
